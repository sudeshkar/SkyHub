# SLO alerts from docs/design/04-observability.md §6. Each links to its runbook.
groups:
  - name: skyhub-slo
    rules:
      - alert: SearchErrorRateHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{application="flight-search", uri!~"/actuator.*", status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{application="flight-search", uri!~"/actuator.*"}[5m])) > 0.01
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Search error rate above 1% for 5 minutes"
          runbook: "docs/runbooks/README.md#searcherrorratehigh"

      - alert: SearchLatencyHigh
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{application="flight-search", uri="/api/v1/itineraries"}[5m]))) > 0.2
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Search p99 above 200 ms for 10 minutes"
          runbook: "docs/runbooks/README.md#searchlatencyhigh"

      - alert: BookingErrorRateHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{application="booking", uri="/api/v1/pnrs", method="POST", status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{application="booking", uri="/api/v1/pnrs", method="POST"}[5m])) > 0.02
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Booking 5xx rate above 2% for 5 minutes"
          runbook: "docs/runbooks/README.md#bookingerrorratehigh"

      - alert: TimetableStale
        expr: time() - skyhub_timetable_last_refresh_seconds > 900
        for: 1m
        labels: { severity: ticket }
        annotations:
          summary: "Timetable not reloaded for over 15 minutes"
          runbook: "docs/runbooks/README.md#timetablestale"

      - alert: DatabaseConnectionsWaiting
        expr: max by (application) (hikaricp_connections_pending) > 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.application }} requests are waiting for database connections"
          runbook: "docs/runbooks/README.md#databaseconnectionswaiting"

      - alert: FlightCatalogUnavailable
        expr: |
          sum(rate(skyhub_flight_catalog_calls_total{result="unavailable"}[5m]))
            / sum(rate(skyhub_flight_catalog_calls_total[5m])) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Booking cannot reach flight-search (over 5% of calls failing)"
          runbook: "docs/runbooks/README.md#flightcatalogunavailable"

      - alert: BookingReferenceGuessing
        expr: sum(rate(skyhub_manage_actions_total{action="session_denied"}[5m])) > 0.2
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Many failed manage-booking lookups (over 12 per minute for 5 minutes)"
          runbook: "docs/runbooks/README.md#bookingreferenceguessing"

      - alert: SeatHoldsAbandoned
        expr: |
          sum(increase(skyhub_seat_holds_total{outcome="expired"}[1h])) > 50
            and
          sum(increase(skyhub_seat_holds_total{outcome="expired"}[1h]))
            / clamp_min(sum(increase(skyhub_seat_holds_total{outcome=~"expired|converted"}[1h])), 1) > 0.9
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "Over 90% of seat holds expire instead of becoming bookings (50+ in the last hour)"
          runbook: "docs/runbooks/README.md#seatholdsabandoned"

      - alert: CheckInRefusedHigh
        expr: |
          sum(increase(skyhub_check_ins_total{outcome="refused"}[15m])) > 20
            and
          sum(increase(skyhub_check_ins_total{outcome="refused"}[15m]))
            / clamp_min(sum(increase(skyhub_check_ins_total[15m])), 1) > 0.5
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "Over half of check-in requests are refused as outside the window (20+ in 15 minutes)"
          runbook: "docs/runbooks/README.md#checkinrefusedhigh"

      - alert: RefundFailed
        expr: sum(increase(skyhub_payments_total{outcome="refund_failed"}[10m])) > 0
        labels: { severity: page }
        annotations:
          summary: "A refund failed after a failed booking: a traveller has been charged and has no booking"
          runbook: "docs/runbooks/README.md#refundfailed"

      - alert: CancellationRefundFailed
        expr: sum(increase(skyhub_payments_total{outcome="cancel_refund_failed"}[10m])) > 0
        labels: { severity: ticket }
        annotations:
          summary: "A refund after a cancellation failed: the booking is cancelled and the traveller is still owed money"
          runbook: "docs/runbooks/README.md#cancellationrefundfailed"

      - alert: StaffLoginGuessing
        expr: sum(increase(skyhub_staff_logins_total{outcome=~"failed|locked"}[10m])) > 10
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: "More than 10 failed or locked staff logins in 10 minutes: someone may be guessing passwords"
          runbook: "docs/runbooks/README.md#staffloginguessing"

      - alert: PaymentProviderUnavailable
        expr: |
          sum(increase(skyhub_payments_total{outcome="unavailable"}[10m])) > 10
            and
          sum(increase(skyhub_payments_total{outcome="unavailable"}[10m]))
            / clamp_min(sum(increase(skyhub_payments_total{outcome=~"unavailable|captured|declined"}[10m])), 1) > 0.5
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Over half of payment attempts cannot reach the payment provider (10+ in 10 minutes)"
          runbook: "docs/runbooks/README.md#paymentproviderunavailable"

      - alert: OutboxBacklog
        expr: min_over_time(skyhub_outbox_pending[10m]) > 0
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: "Booking events have been waiting to reach Kafka for 10 minutes: travellers are not being notified"
          runbook: "docs/runbooks/README.md#outboxbacklog"

      - alert: NotificationDeadLettered
        expr: increase(skyhub_notifications_dead_lettered_total[10m]) > 0
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: "A notification gave up after its retries and was parked on the dead-letter topic"
          runbook: "docs/runbooks/README.md#notificationdeadlettered"

      - alert: FlightDisruptionEventsUnreadable
        expr: increase(skyhub_flight_status_events_total{outcome="invalid"}[10m]) > 0
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: "Flight search skipped a disruption message it could not read: a cancelled flight may still be offered"
          runbook: "docs/runbooks/README.md#flightdisruptioneventsunreadable"

      - alert: CheckInRemindersFailing
        expr: increase(skyhub_checkin_reminders_total{outcome="failed"}[30m]) > 2
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: "The check-in reminder sweep has failed repeatedly: travellers are not being told check-in is open"
          runbook: "docs/runbooks/README.md#checkinremindersfailing"

      - alert: RefundGaveUp
        expr: increase(skyhub_refund_retries_total{outcome="gave_up"}[10m]) > 0
        for: 0m
        labels: { severity: page }
        annotations:
          summary: "A refund failed on every retry for over a day: a traveller is owed money and only a person can fix it"
          runbook: "docs/runbooks/README.md#refundgaveup"

      - alert: AccountLoginGuessing
        expr: sum(increase(skyhub_account_logins_total{outcome=~"failed|locked"}[10m])) > 30
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: "More than 30 failed or locked traveller sign-ins in 10 minutes: someone may be guessing passwords"
          runbook: "docs/runbooks/README.md#accountloginguessing"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }} is not answering Prometheus scrapes"
          runbook: "docs/runbooks/README.md#servicedown"
