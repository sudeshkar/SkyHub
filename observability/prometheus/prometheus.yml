# Scrapes the services' management ports. Locally the services run on the host machine.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flight-search
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9081"]

  - job_name: booking
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9082"]

  - job_name: notification
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9083"]
