# Retrieval evals (ADR-0091): questions written the way a traveller asks them, not in the articles' words.
#
# answerable:  each question, and the article (or articles) whose passage should come back
# off_topic:   nothing to do with SkyHub or travel; retrieval must return nothing
# not_covered: travel questions the help centre does not answer (SkyHub has no baggage, meal or loyalty rules). They sit
#              as close to the passages as real answers do, so no distance cut-off can drop them without dropping real
#              answers: some passages come back, and the model must see they do not answer and say it does not know.
#              Reported here; held to account by the answer evals of the next slices (ADR-0091).
#
# Written by the same person as the articles, so kinder than real travellers. Add real questions when the chat exists.

answerable:
  # booking-a-flight
  - question: How many people can I put on one booking?
    article: booking-a-flight
  - question: Can I book a trip with several flights in one go?
    article: booking-a-flight
  - question: The seats I picked disappeared while I was typing passenger names. Why?
    article: booking-a-flight
  - question: I clicked pay twice, will I be charged twice?
    article: booking-a-flight
  - question: Do I need an account to book a flight?
    article: [booking-a-flight, your-account]
  - question: Is there business class?
    article: booking-a-flight
  - question: Where is my e-ticket?
    article: booking-a-flight

  # connecting-in-dubai
