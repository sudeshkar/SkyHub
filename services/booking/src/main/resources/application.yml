server:
  tomcat:
    # Default is 100 requests per connection, after which Tomcat closes it and clients reconnect.
    # Behind a load balancer that keeps connections open, that churn costs throughput.
    max-keep-alive-requests: 10000
  port: 8082

spring:
  http:
    clients:
      # Calls to flight-search fail fast instead of tying up request threads.
      connect-timeout: 1s
      read-timeout: 2s
  autoconfigure:
    # No users or logins in this service; don't create Spring Security's default in-memory user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: booking
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking}
    username: ${DB_USERNAME:skyhub}
    password: ${DB_PASSWORD:skyhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Flush seat updates in primary-key order so concurrent multi-seat bookings
        # lock rows in the same order and cannot deadlock each other.
        order_updates: true

skyhub:
  flight-search:
    url: ${FLIGHT_SEARCH_URL:http://localhost:8081}
  security:
    # Base64 256-bit AES key for personal data at rest. No default: the service refuses to start without it.
    pii-key: ${SKYHUB_PII_KEY:}
    # Base64 256-bit HMAC key that signs manage-booking tokens (ADR-0011). Separate from pii-key on purpose.
    manage-token-key: ${SKYHUB_MANAGE_TOKEN_KEY:}
    manage-token-ttl: PT15M
    # Base64 256-bit HMAC key that signs boarding pass barcodes (ADR-0013). Separate from the other keys on purpose.
    boarding-pass-key: ${SKYHUB_BOARDING_PASS_KEY:}
    # Staff tokens (ADR-0017) are signed with the manage-token key and told apart by scope.
    staff-token-ttl: PT30M
    # BCrypt cost for staff passwords. Raise it as hardware gets faster; tests lower it.
    staff-password-strength: 12
  bootstrap:
    # The first administrator, created once when no staff accounts exist (ADR-0017). Ignored afterwards.
    # The password needs at least 12 characters. Leave both empty to start with no staff.
    admin-username: ${SKYHUB_BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${SKYHUB_BOOTSTRAP_ADMIN_PASSWORD:}

management:
  # Actuator lives on its own port, never exposed publicly (docs/design/04-observability.md §7).
  server:
    port: 9082
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
    export:
      # Off by default so a laptop without the observability stack isn't flooded with export errors.
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs
      file: ecs
  file:
    # Set LOG_FILE to also write JSON logs to a file (collected by Grafana Alloy into Loki).
    name: ${LOG_FILE:}