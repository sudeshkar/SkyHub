server:
  tomcat:
    # Default is 100 requests per connection, after which Tomcat closes it and clients reconnect.
    # Behind a load balancer that keeps connections open, that churn costs throughput.
    max-keep-alive-requests: 10000
  port: 8081

spring:
  autoconfigure:
    # No users or logins in this service; don't create Spring Security's default in-memory user.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: flight-search
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flightsearch}
    username: ${DB_USERNAME:skyhub}
    password: ${DB_PASSWORD:skyhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Every instance rebuilds the whole picture from the start of the compacted topic (ADR-0025).
      auto-offset-reset: earliest
      enable-auto-commit: false

management:
  # Actuator lives on its own port, never exposed publicly (docs/design/04-observability.md §7).
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
    export:
      # Off by default so a laptop without the observability stack isn't flooded with export errors.
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs
      file: ecs
  file:
    # Set LOG_FILE to also write JSON logs to a file (collected by Grafana Alloy into Loki).
    name: ${LOG_FILE:}

# Hub network — see docs/adr/0001-multi-hub-configuration.md
skyhub:
  flight-status:
    # Follow flight delays and cancellations from Kafka (ADR-0025). Switch off only where there is no broker (tests).
    listener:
      enabled: true
    topic: skyhub.flight.disruptions
  # In-memory timetable (ADR-0006): reloaded on this interval; searches never query the database.
  timetable:
    refresh-interval: PT5M
  hubs:
    - code: DXB
      name: Dubai International
      active: true
      minimum-connection-time: 75m
    - code: DWC
      name: Al Maktoum International
      active: true
      minimum-connection-time: 60m
  airport-transfers:
    - from: DXB
      to: DWC
      duration: 120m
  max-layover: 12h
