server:
  # No public API. The only web endpoints are the actuator ones, which live on the management port below.
  port: 8083

spring:
  application:
    name: notification
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${DB_USERNAME:skyhub}
    password: ${DB_PASSWORD:skyhub}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    # Mailpit in docker compose catches every email and shows it at http://localhost:8025 (ADR-0021).
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      # A mail server that hangs must fail fast, so the message is retried instead of tying up the consumer.
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification
      # A new consumer group reads the topic from the beginning, so a freshly started service misses nothing.
      auto-offset-reset: earliest
      enable-auto-commit: false

skyhub:
  notifications:
    topic: skyhub.booking.events
    email:
      # smtp (default) sends through the mail server above; log only writes the email to the log.
      mode: ${SKYHUB_EMAIL_MODE:smtp}
      from: ${SKYHUB_EMAIL_FROM:SkyHub <no-reply@skyhub.example>}
    # A message that fails is tried again this many times in total, this far apart, then parked on <topic>.DLT.
    retry-attempts: 4
    retry-interval: PT2S

management:
  health:
    mail:
      # A mail outage must not make the service look down: messages are retried, then parked (ADR-0021).
      enabled: false
  # Actuator lives on its own port, never exposed publicly (docs/design/04-observability.md §7).
  server:
    port: 9083
  endpoints:
    web:
      exposure:
        # deadletters lists and replays parked messages (ADR-0032); this port is never exposed publicly.
        include: health,info,prometheus,deadletters
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
      file: ecs
  file:
    # Set LOG_FILE to also write JSON logs to a file (collected by Grafana Alloy into Loki).
    name: ${LOG_FILE:}
