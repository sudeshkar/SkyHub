name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Testcontainers uses the runner's Docker daemon for PostgreSQL and Redis.
      - run: sh mvnw -B verify

  # The disruption agent (ADR-0022): unit tests, the guardrail fuzz test and the offline evals. Needs no API key.
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/disruption-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/disruption-agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  # The service images (ADR-0081): the guard tests, then a real build of each Java service from the one Dockerfile.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [flight-search, booking, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest && python -m pytest docker/checks
      - run: docker build -f docker/service.Dockerfile --build-arg SERVICE=${{ matrix.service }} -t skyhub/${{ matrix.service }}:ci .

  # The agent's and the website's images (ADR-0082): each is built from its own folder.
  images-other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/disruption-agent.Dockerfile -t skyhub/disruption-agent:ci services/disruption-agent
      - run: docker build -f docker/website.Dockerfile -t skyhub/website:ci frontend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the OpenAPI spec
        run: npm run api:types && git diff --exit-code src/lib/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
