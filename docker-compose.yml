# Local infrastructure: `docker compose up -d`, then run the services from your IDE or with ./mvnw spring-boot:run
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: skyhub
      POSTGRES_PASSWORD: skyhub
      POSTGRES_DB: flightsearch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyhub"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
