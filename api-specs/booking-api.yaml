openapi: 3.0.3
info:
  title: SkyHub Booking API
  version: 1.0.0
  description: |
    Seat maps and passenger name records (PNRs). A PNR holds every segment of an itinerary
    (e.g. CMB→DXB and DWC→JFK) and one seat per passenger per segment.
servers:
  - url: http://localhost:8082
tags:
  - name: SeatMaps
  - name: Pnrs
  - name: ManageBooking
  - name: Holds
  - name: CheckIn
  - name: Disruptions

paths:
  /api/v1/flights/{flightNumber}/departures/{departureDate}/seats:
    get:
      tags: [SeatMaps]
      operationId: getSeatMap
      summary: Seat map for one flight on one date
      parameters:
        - name: flightNumber
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FlightNumber'
        - name: departureDate
          in: path
          required: true
          description: UTC departure date of the flight
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Seat map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FlightNotFound'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/holds:
    post:
      tags: [Holds]
      operationId: createHold
      summary: Hold seats for a few minutes while the traveller completes a booking
      description: |
        Holds every requested seat or none. The hold lasts 10 minutes. Pass the returned `holdId` to
        `POST /pnrs` to turn the held seats into a booking; if it has expired, the booking is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHoldRequest'
      responses:
        '201':
          description: Seats held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FlightNotFound'
        '409':
          description: At least one seat is not available; nothing was held
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/holds/{holdId}:
    delete:
      tags: [Holds]
      operationId: releaseHold
      summary: Let go of held seats
      description: Safe to repeat. An unknown or already-expired hold is not an error.
      parameters:
        - name: holdId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The seats are no longer held by this hold

  /api/v1/pnrs:
    post:
      tags: [Pnrs]
      operationId: createPnr
      summary: Book seats on every segment and create a PNR
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key (e.g. a UUID). Repeating it returns the original PNR instead of booking again.
          schema:
            type: string
            minLength: 8
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePnrRequest'
      responses:
        '201':
          description: PNR created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '200':
          description: Replay of an earlier request with the same Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FlightNotFound'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'
        '409':
          description: A requested seat is no longer available
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/pnrs/{locator}/sessions:
    post:
      tags: [ManageBooking]
      operationId: openManageSession
      summary: Prove ownership of a booking and get a short-lived manage token
      description: |
        Checks the last name of any passenger on the booking. On success returns a signed token
        (15 minutes) that authorises reading and changing this booking only. An unknown reference
        and a wrong last name both return 404, so neither can be probed.
      parameters:
        - $ref: '#/components/parameters/Locator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageSessionRequest'
      responses:
        '201':
          description: Session opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/pnrs/{locator}:
    get:
      tags: [ManageBooking]
      operationId: getPnr
      summary: Retrieve a booking
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/pnrs/{locator}/cancellation:
    post:
      tags: [ManageBooking]
      operationId: cancelPnr
      summary: Cancel a booking and release its seats
      description: Idempotent. Cancelling an already-cancelled booking returns it unchanged.
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      responses:
        '200':
          description: The cancelled booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/pnrs/{locator}/seat-assignments:
    put:
      tags: [ManageBooking]
      operationId: changeSeat
      summary: Move one passenger to another seat on one flight
      description: Books the new seat and releases the old one in a single transaction.
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatChange'
      responses:
        '200':
          description: The updated booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'
        '409':
          description: The seat is taken, or the booking is cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/pnrs/{locator}/check-ins:
    post:
      tags: [CheckIn]
      operationId: checkIn
      summary: Check in every passenger on one flight and get their boarding passes
      description: |
        Open from 24 hours to 60 minutes before departure. Idempotent: checking in again returns the same
        passes and does not renumber anyone. A flight that is checked in can no longer have its seats changed.
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '201':
          description: Checked in now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPasses'
        '200':
          description: Already checked in; the same passes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPasses'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'
        '409':
          description: Check-in is not open yet, is closed, or the booking is cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/ops/disruptions:
    post:
      tags: [Disruptions]
      operationId: recordDisruption
      summary: Record a delay or cancellation of one flight on one date
      description: |
        Idempotent: recording again for the same flight and date replaces the earlier record, so a retry or a
        correction is the same request. Returns how many active bookings are on the flight.
      security:
        - opsKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDisruptionRequest'
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisruptionRecorded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/pnrs/{locator}/disruptions:
    get:
      tags: [Disruptions]
      operationId: getDisruptions
      summary: Delays and cancellations on the flights of this booking
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      responses:
        '200':
          description: Possibly empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDisruptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/pnrs/{locator}/check-ins/{segmentIndex}:
    get:
      tags: [CheckIn]
      operationId: getBoardingPasses
      summary: The boarding passes of a flight that is checked in
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
        - name: segmentIndex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 3
      responses:
        '200':
          description: The boarding passes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPasses'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such booking, or this flight is not checked in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The booking is cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    opsKey:
      type: apiKey
      in: header
      name: X-Ops-Key
      description: Operations credential (SKYHUB_OPS_KEY). Held by operations tooling only; never sent by the website.
    manageToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived token from POST /api/v1/pnrs/{locator}/sessions, valid for that booking only.

  parameters:
    Locator:
      name: locator
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z0-9]{6}$'

  responses:
    PnrNotFound:
      description: No booking matches
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid or expired manage token
    Forbidden:
      description: The token belongs to a different booking
    FlightNotFound:
      description: The flight does not operate on that date
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ScheduleUnavailable:
      description: The timetable could not be checked; retry later
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    FlightNumber:
      type: string
      pattern: '^[A-Z0-9]{2}[0-9]{1,4}$'
      example: SK501

    DisruptionType:
      type: string
      enum: [DELAYED, CANCELLED]

    RecordDisruptionRequest:
      type: object
      required: [flightNumber, departureDate, type]
      properties:
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
          description: The flight's scheduled departure date (UTC)
        type:
          $ref: '#/components/schemas/DisruptionType'
        revisedDeparture:
          type: string
          format: date-time
          description: Required for DELAYED, must be omitted for CANCELLED
        reason:
          type: string
          maxLength: 200
          description: Shown to travellers. Keep it free of personal data.

    DisruptionRecorded:
      type: object
      required: [affectedBookings]
      properties:
        affectedBookings:
          type: integer
          minimum: 0
          description: Active bookings on this flight and date

    Disruption:
      type: object
      required: [segmentIndex, flightNumber, departureDate, type]
      properties:
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 3
          description: Position of the flight in this booking
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/DisruptionType'
        revisedDeparture:
          type: string
          format: date-time
        reason:
          type: string

    BookingDisruptions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Disruption'

    SeatNumber:
      type: string
      pattern: '^[0-9]{1,2}[A-K]$'
      example: 11D

    Cabin:
      type: string
      enum: [BUSINESS, ECONOMY]

    SeatStatus:
      type: string
      enum: [AVAILABLE, HELD, BOOKED]

    Seat:
      type: object
      required: [seatNumber, row, letter, cabin, status]
      properties:
        seatNumber:
          $ref: '#/components/schemas/SeatNumber'
        row:
          type: integer
        letter:
          type: string
        cabin:
          $ref: '#/components/schemas/Cabin'
        status:
          $ref: '#/components/schemas/SeatStatus'

    SeatMap:
      type: object
      required: [flightNumber, departureDate, seats]
      properties:
        flightNumber:
          type: string
        departureDate:
          type: string
          format: date
        seats:
          type: array
          description: Ordered by row, then letter
          items:
            $ref: '#/components/schemas/Seat'

    Segment:
      type: object
      required: [flightNumber, departureDate]
      properties:
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date

    PassengerRequest:
      type: object
      required: [firstName, lastName, seats]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
        seats:
          type: array
          description: One seat per segment, in segment order
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/SeatNumber'

    CreatePnrRequest:
      type: object
      required: [contactEmail, segments, passengers]
      properties:
        holdId:
          type: string
          format: uuid
          description: Hold made earlier for these exact seats. Without it, the seats are booked directly.
        contactEmail:
          type: string
          format: email
          maxLength: 254
        segments:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/Segment'
        passengers:
          type: array
          minItems: 1
          maxItems: 9
          items:
            $ref: '#/components/schemas/PassengerRequest'

    Passenger:
      type: object
      required: [firstName, lastName, seats]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        seats:
          type: array
          description: One seat per segment, in segment order
          items:
            type: string

    PnrStatus:
      type: string
      enum: [CONFIRMED, CANCELLED]

    Pnr:
      type: object
      required: [locator, status, contactEmail, segments, passengers, createdAt]
      properties:
        locator:
          type: string
          example: ABC234
        status:
          $ref: '#/components/schemas/PnrStatus'
        contactEmail:
          type: string
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/Passenger'
        createdAt:
          type: string
          format: date-time

    CheckInRequest:
      type: object
      required: [segmentIndex]
      properties:
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 3

    BoardingPass:
      type: object
      required: [passengerName, locator, flightNumber, departureDate, seatNumber, sequence, barcode]
      properties:
        passengerName:
          type: string
          description: SURNAME/FIRSTNAME, upper case, as printed on the pass
          example: PERERA/PRIYA
        locator:
          type: string
          example: ABC234
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
        seatNumber:
          $ref: '#/components/schemas/SeatNumber'
        sequence:
          type: integer
          minimum: 1
          description: Boarding sequence number on this flight, in order of check-in
        barcode:
          type: string
          description: Signed payload for the gate scanner. Any change to the pass invalidates it.

    BoardingPasses:
      type: object
      required: [passes]
      properties:
        passes:
          type: array
          items:
            $ref: '#/components/schemas/BoardingPass'

    ManageSessionRequest:
      type: object
      required: [lastName]
      properties:
        lastName:
          type: string
          minLength: 1
          maxLength: 50

    ManageSession:
      type: object
      required: [accessToken, tokenType, expiresAt, pnr]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time
        pnr:
          $ref: '#/components/schemas/Pnr'

    SeatChange:
      type: object
      required: [passengerIndex, segmentIndex, seatNumber]
      properties:
        passengerIndex:
          type: integer
          minimum: 0
          maximum: 8
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 3
        seatNumber:
          $ref: '#/components/schemas/SeatNumber'

    HoldItem:
      type: object
      required: [flightNumber, departureDate, seatNumber]
      properties:
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
        seatNumber:
          $ref: '#/components/schemas/SeatNumber'

    CreateHoldRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 36
          items:
            $ref: '#/components/schemas/HoldItem'

    Hold:
      type: object
      required: [holdId, expiresAt, items]
      properties:
        holdId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/HoldItem'

    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
