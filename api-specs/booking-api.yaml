openapi: 3.0.3
info:
  title: SkyHub Booking API
  version: 1.0.0
  description: |
    Seat maps and passenger name records (PNRs). A PNR holds every segment of an itinerary
    (e.g. CMB→DXB and DWC→JFK) and one seat per passenger per segment.
servers:
  - url: http://localhost:8082
tags:
  - name: SeatMaps
  - name: Pnrs
  - name: ManageBooking
  - name: Holds
  - name: CheckIn
  - name: Disruptions
  - name: Staff
  - name: Rebooking
  - name: Accounts
  - name: MyBookings
  - name: BulkRebooking
  - name: AccountEmail
  - name: AccountSecurity

paths:
  /api/v1/flights/{flightNumber}/departures/{departureDate}/seats:
    get:
      tags: [SeatMaps]
      operationId: getSeatMap
      summary: Seat map for one flight on one date
      parameters:
        - name: flightNumber
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FlightNumber'
        - name: departureDate
          in: path
          required: true
          description: UTC departure date of the flight
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Seat map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FlightNotFound'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/holds:
    post:
      tags: [Holds]
      operationId: createHold
      summary: Hold seats for a few minutes while the traveller completes a booking
      description: |
        Holds every requested seat or none. The hold lasts 10 minutes. Pass the returned `holdId` to
        `POST /pnrs` to turn the held seats into a booking; if it has expired, the booking is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHoldRequest'
      responses:
        '201':
          description: Seats held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FlightNotFound'
        '409':
          description: At least one seat is not available; nothing was held
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/holds/{holdId}:
    delete:
      tags: [Holds]
      operationId: releaseHold
      summary: Let go of held seats
      description: Safe to repeat. An unknown or already-expired hold is not an error.
      parameters:
        - name: holdId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The seats are no longer held by this hold

  /api/v1/pnrs:
    post:
      tags: [Pnrs]
      operationId: createPnr
      summary: Pay for, and book, seats on every segment and create a PNR
      description: |
        The server works out the price and charges `paymentToken` before booking (ADR-0015). If booking then
        fails, the charge is refunded. The same `Idempotency-Key` never charges twice. If `expectedAmount` is
        sent and differs from the server's price, nothing is charged and the answer is 409.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key (e.g. a UUID). Repeating it returns the original PNR instead of booking again.
          schema:
            type: string
            minLength: 8
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePnrRequest'
      responses:
        '201':
          description: PNR created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '200':
          description: Replay of an earlier request with the same Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FlightNotFound'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'
        '402':
          description: The payment was declined; nothing was booked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A requested seat is no longer available (any charge was refunded), or the price changed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/quotes:
    post:
      tags: [Pnrs]
      operationId: quote
      summary: The price of a trip, worked out by the server
      description: The same calculation that `POST /pnrs` charges. Fares come from the flight schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: The price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FlightNotFound'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/pnrs/{locator}/sessions:
    post:
      tags: [ManageBooking]
      operationId: openManageSession
      summary: Prove ownership of a booking and get a short-lived manage token
      description: |
        Checks the last name of any passenger on the booking. On success returns a signed token
        (15 minutes) that authorises reading and changing this booking only. An unknown reference
        and a wrong last name both return 404, so neither can be probed.
      parameters:
        - $ref: '#/components/parameters/Locator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageSessionRequest'
      responses:
        '201':
          description: Session opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/PnrNotFound'
    delete:
      tags: [ManageBooking]
      operationId: endManageSessions
      summary: Sign out of a booking everywhere
      description: |
        Ends every open session of this booking (ADR-0057): the token used for this call and any copy of it are refused from the next
        request on, and a new session needs the last name again. It needs no password and can only make the booking harder to
        reach, never easier. Other bookings are not affected. A token for another booking is 403.
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      responses:
        '204':
          description: Every session of the booking has ended
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/pnrs/{locator}:
    get:
      tags: [ManageBooking]
      operationId: getPnr
      summary: Retrieve a booking
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/pnrs/{locator}/cancellation:
    post:
      tags: [ManageBooking]
      operationId: cancelPnr
      summary: Cancel a booking and release its seats
      description: |
        Idempotent. Cancelling an already-cancelled booking returns it unchanged, except that a refund still
        `PENDING` is tried again. Money goes back in full if the airline cancelled a flight on the booking or
        the first departure is 24 hours or more away; otherwise nothing is refunded (ADR-0016). The booking is
        cancelled even when the payment provider cannot be reached: the refund is then `PENDING`.
        Returns 503 and changes nothing when the timetable cannot be checked.
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      responses:
        '200':
          description: The cancelled booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/pnrs/{locator}/seat-assignments:
    put:
      tags: [ManageBooking]
      operationId: changeSeat
      summary: Move one passenger to another seat on one flight
      description: Books the new seat and releases the old one in a single transaction.
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatChange'
      responses:
        '200':
          description: The updated booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'
        '409':
          description: The seat is taken, or the booking is cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/pnrs/{locator}/check-ins:
    post:
      tags: [CheckIn]
      operationId: checkIn
      summary: Check in the party, or chosen passengers, on one flight and get their boarding passes
      description: |
        Open from 24 hours to 60 minutes before departure. Everyone on the booking is checked in unless `passengerIndexes` names who
        (ADR-0058). Idempotent: checking in again returns the same passes and does not renumber anyone, even after check-in has closed
        (when everyone asked for is already in). The answer holds the passes of **everyone who is checked in on the flight** after the call,
        not only those asked for, as `GET` does; it is 201 if the call checked in anyone new. A passenger who is checked in can no longer
        have their seat changed; the others still can.
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '201':
          description: Checked in now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPasses'
        '200':
          description: Already checked in; the same passes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPasses'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'
        '409':
          description: Check-in is not open yet, is closed, or the booking is cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/ops/boarding-passes/verification:
    post:
      tags: [CheckIn]
      operationId: verifyBoardingPass
      summary: Is this scanned boarding pass still good?
      description: |
        For a gate (ADR-0056). A pass is good only if it is signed by us AND is exactly the pass that would be issued for the booking
        now. A pass that was checked out of (ADR-0055), replaced by a new seat or a new check-in, or that belongs to a cancelled booking
        or flight, is refused even though its signature is still genuine. A refused pass answers `valid: false` with a `reason` and
        nothing about the passenger; only a good pass returns who and where. Not valid is a 200, because it is the answer, not an error.
        Anything not signed by us, or changed, is `BAD_SIGNATURE` and nothing is looked up.
      security:
        - staffToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardingPassVerificationRequest'
      responses:
        '200':
          description: The verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPassVerification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops/boarding-passes/boardings:
    post:
      tags: [CheckIn]
      operationId: boardPassenger
      summary: A gate scans a pass and the passenger boards
      description: |
        For a gate (ADR-0060). The pass is checked exactly as in `verifyBoardingPass`, and if it is good the passenger **boards**: once.
        `valid: true` here means the passenger has boarded now, and the answer carries the pass. A pass that has been used is refused the
        second time with `ALREADY_BOARDED`; the first scan is the one that counts, and the staff member who made it is recorded from their
        token. A refused pass says only why, never who it was for. Checking a pass with `verifyBoardingPass` never boards anyone.
        A passenger who has boarded can no longer check out.
      security:
        - staffToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardingPassVerificationRequest'
      responses:
        '200':
          description: The verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPassVerification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops/disruptions:
    post:
      tags: [Disruptions]
      operationId: recordDisruption
      summary: Record a delay or cancellation of one flight on one date
      description: |
        Idempotent: recording again for the same flight and date replaces the earlier record, so a retry or a
        correction is the same request. Returns how many active bookings are on the flight.
      security:
        - staffToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDisruptionRequest'
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisruptionRecorded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops/disruptions/{flightNumber}/{departureDate}:
    delete:
      tags: [Disruptions]
      operationId: withdrawDisruption
      summary: Take back a disruption that was recorded by mistake or has been resolved
      description: |
        Staff only. The flight is for sale again and search shows it as scheduled. Every traveller still holding the
        flight is emailed that it is operating again (ADR-0028). Refused with 409 once any booking has been
        moved off the flight, because the refund those travellers were promised rests on the disruption record.
        Returns how many active bookings are on the flight. A second request finds nothing and answers 404.
      security:
        - staffToken: []
      parameters:
        - name: flightNumber
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FlightNumber'
        - name: departureDate
          in: path
          required: true
          description: Scheduled UTC departure date of the flight
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisruptionRecorded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No disruption is recorded for that flight and date
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Bookings were moved off the flight, so the disruption has to stay on record
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/ops/flights/{flightNumber}/departures/{departureDate}/bookings:
    get:
      tags: [Disruptions]
      operationId: getAffectedBookings
      summary: The active bookings on one flight, for working out who a disruption affects
      description: |
        Staff only. Lists each confirmed booking that holds a seat on the flight, with its reference, how many
        seats it holds, which of its flights this is, and its whole route. It carries no names and no contact
        details, so the answer can be given to tools that must not see personal data (ADR-0022).
      security:
        - staffToken: []
      parameters:
        - name: flightNumber
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FlightNumber'
        - name: departureDate
          in: path
          required: true
          description: Scheduled UTC departure date of the flight
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Possibly empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffectedBookings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops/pnrs/{locator}/rebooking:
    post:
      tags: [Rebooking]
      operationId: rebookFlight
      summary: Move one flight of a booking onto another, after a disruption
      description: |
        Staff only (ADR-0023). Moves the given flight of the booking onto another flight, choosing seats for the whole party
        (kept together, in the cabin they were in). Refused unless the flight being left has a recorded delay or
        cancellation, the booking is active and not checked in on it, and the new flight operates, is not cancelled, flies
        the same route, does not leave before the original was due, and keeps the traveller's connections: it must land at
        least 60 minutes before the booking's next flight leaves and leave at least 60 minutes after the previous flight
        lands, on expected times (ADR-0036). Everything or nothing happens. Asking again for a
        move that is already done changes nothing and answers `changed: false`. The traveller is emailed.
      security:
        - staffToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebookRequest'
      responses:
        '200':
          description: Moved, or already there
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rebooked'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'
        '409':
          description: 'Refused: a rule forbids this move, or the seats are not there'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/ops/rebookings:
    post:
      tags: [BulkRebooking]
      operationId: rebookFlights
      summary: Move many bookings off disrupted flights in one request
      description: |
        Staff only (ADR-0035). Each move is exactly what `POST /api/v1/ops/pnrs/{locator}/rebooking` does, with the same
        rules, audit and email, and each is its own transaction: **a move is all or nothing, the request is not.** A refused
        or conflicted move changes nothing and the rest carry on; the answer lists each move's result in request order.
        After the timetable is unavailable or something unexpected fails, the remaining moves are not tried
        (`NOT_ATTEMPTED`). Moves run one after another. Repeating a request is safe: a move already done answers
        `UNCHANGED`. At most 50 moves; none, more, or the same booking and flight twice is a 400 and nothing changes.
      security:
        - staffToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRebookRequest'
      responses:
        '200':
          description: One result per move, in request order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRebooked'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/password-links:
    post:
      tags: [Accounts]
      operationId: requestPasswordLink
      summary: Email a link to choose a password (sign up, or reset a forgotten one)
      description: |
        The same request signs up a new traveller and resets a forgotten password: the link lets the person who
        receives it choose a password, which is how the address is proven to be theirs (ADR-0033). The answer is always
        202 and never says whether an account already exists. A second request within two minutes sends nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLinkRequest'
      responses:
        '202':
          description: If the address is valid, a link is on its way
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/accounts/passwords:
    post:
      tags: [Accounts]
      operationId: setAccountPassword
      summary: Choose a password using the emailed link
      description: |
        The token comes from the emailed link. It works once and for one hour. A wrong, used or expired token all
        return the same 400. Choosing a password also confirms the email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '204':
          description: Password set; the account can sign in
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/accounts/sessions:
    post:
      tags: [Accounts]
      operationId: openAccountSession
      summary: Traveller sign-in
      description: |
        Exchanges an email address and password for an account token (30 minutes). An unknown address, a wrong
        password, an account with no password yet and a locked account all return the same 401. Five wrong passwords
        lock the account for 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountLoginRequest'
      responses:
        '201':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email or password, or the account is locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/accounts/me:
    get:
      tags: [Accounts]
      operationId: getMyAccount
      summary: The signed-in traveller's account
      security:
        - accountToken: []
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/me/sessions:
    delete:
      tags: [AccountSecurity]
      operationId: endAllAccountSessions
      summary: Sign out everywhere
      description: |
        Ends every open session of the signed-in account, including the one that asks (ADR-0047): each account token issued
        before this is refused on its next request, and a fresh sign-in works at once. It needs no password, since it can only
        make the account harder to use. The password, the address and bookings are untouched, and booking tokens already opened
        from the account (ADR-0034) are separate credentials that expire on their own within 15 minutes.
      security:
        - accountToken: []
      responses:
        '204':
          description: Every session of the account has ended
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/me/email-change:
    post:
      tags: [AccountEmail]
      operationId: requestEmailChange
      summary: Ask to move the account to another email address
      description: |
        Needs the account's current password and sends a link to the NEW address (ADR-0039). Nothing changes until the link is
        used. The answer is always 202 and never says whether the new address already has an account. A request within two
        minutes of the last sends nothing. A wrong or locked password is a 403 (not a 401, so the session is not taken for
        ended); the same five-wrong-passwords lock as sign-in applies. The account's own current address is a 400.
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '202':
          description: If the new address can be used, a link is on its way to it
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The password was not accepted, or the account is locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/accounts/me/email-change/confirmation:
    post:
      tags: [AccountEmail]
      operationId: confirmEmailChange
      summary: Move the account to the new address using the emailed link
      description: |
        Needs the signed-in account and the token from the link sent to the new address; either alone is not enough. The
        token works once and for one hour. A wrong, used, expired or someone else's token, or an address another account took
        meanwhile, all return the same 400. Changing the address also stops any password link already sent to the old
        address. Bookings are listed by address, so the account then lists the new address's bookings.
      security:
        - accountToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirmation'
      responses:
        '204':
          description: The account now has the new address
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/email-change-reversals:
    post:
      tags: [AccountEmail]
      operationId: undoEmailChange
      summary: Take the account back to the address it had before it was moved
      description: |
        For the person who can read the OLD address of an account that was moved without them (ADR-0054). The token comes from
        the notice sent to that address when the account moved. It needs no sign-in, because the account may be lost, and it only
        ever undoes the latest move: it works once, for seven days. Taking the account back puts the old address back, ends every
        session, throws the password away (the person who moved the account may know it) and sends a link to the old address to
        choose a new one. A wrong, used or expired token, or an old address that another account has taken since, all return the
        same 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeReversal'
      responses:
        '204':
          description: The account has its old address back and a link to choose a new password is on its way to it
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/accounts/me/bookings:
    get:
      tags: [MyBookings]
      operationId: listMyBookings
      summary: Bookings made with the signed-in traveller's address
      description: |
        Up to 50 bookings whose contact address is the account's address (ADR-0034), newest first. Summaries hold
        no names, seats or addresses. When there are older bookings, `nextCursor` is set and `truncated` is true: send
        `nextCursor` back as `cursor` for the next page (ADR-0038). Every page costs the same however far back it is. A
        cursor that this service did not make is a 400. `when` narrows the list (ADR-0042) without changing its order or its
        cursor: `upcoming` is a confirmed booking with a flight today or later (UTC), `past` is every other booking,
        including cancelled ones, and `all` (the default) is both. **`upcoming` is listed soonest flight first** (ADR-0044), by
        the date of each booking's next flight; **`past` is listed by the most recently flown first** (ADR-0051), by the date of
        the last flight on each booking (a cancelled booking is positioned by the flights it would have had); `all` is newest
        booked first. The three orders use different kinds of cursor, so a cursor from one is a 400 for the others.
      security:
        - accountToken: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: 'The `nextCursor` of the previous page. Opaque, so do not build one.'
          schema:
            type: string
            maxLength: 200
        - name: when
          in: query
          required: false
          description: 'Which bookings to list: all (the default), upcoming, or past (which includes cancelled bookings). Anything else is a 400.'
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: One page of bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyBookings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/accounts/me/bookings/{locator}/sessions:
    post:
      tags: [MyBookings]
      operationId: openMyBookingSession
      summary: Open one of my bookings without its last name
      description: |
        Returns the same session as the guest flow: a short-lived manage token for this one booking, and the booking.
        Only for a booking whose contact address is the account's. Any other reference, existing or not, returns the
        same 404.
      security:
        - accountToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      responses:
        '201':
          description: Session opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/ops/sessions:
    post:
      tags: [Staff]
      operationId: openStaffSession
      summary: Staff login
      description: |
        Exchanges a username and password for a staff token (30 minutes) that carries the staff member's role.
        An unknown user, a wrong password and a locked account all return the same 401. Five wrong passwords lock
        the account for 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      responses:
        '201':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong username or password, or the account is locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/ops/staff:
    post:
      tags: [Staff]
      operationId: createStaffAccount
      summary: Create a staff account
      description: Administrators only. The password is stored only as a hash.
      security:
        - staffToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: That username is taken
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/pnrs/{locator}/disruptions:
    get:
      tags: [Disruptions]
      operationId: getDisruptions
      summary: Delays and cancellations on the flights of this booking
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      responses:
        '200':
          description: Possibly empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDisruptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/pnrs/{locator}/check-ins/{segmentIndex}:
    get:
      tags: [CheckIn]
      operationId: getBoardingPasses
      summary: The boarding passes of a flight that is checked in
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
        - name: segmentIndex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 3
      responses:
        '200':
          description: The boarding passes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPasses'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such booking, or this flight is not checked in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The booking is cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [CheckIn]
      operationId: checkOut
      summary: Check the party, or chosen passengers, out of one flight, so their seats can be changed again
      description: |
        Undoes the check-in of one flight (ADR-0055). Everyone who is checked in is checked out unless `passengerIndex` names who
        (ADR-0058); naming a passenger who is not checked in changes nothing for them. Allowed until check-in closes, 60 minutes before departure (the revised time
        if the flight was delayed), and always for a cancelled flight. The boarding passes stop being shown, and checking in again gives
        the party new boarding numbers. Passes already issued are signed and are not revoked; there is no gate system here to refuse
        them. Idempotent: a flight that is not checked in is also 204.
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
        - name: segmentIndex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 3
        - name: passengerIndex
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 9
            items:
              type: integer
              minimum: 0
              maximum: 8
      responses:
        '204':
          description: The passengers asked for are not checked in now
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'
        '409':
          description: Check-in has closed, or the booking is cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

components:
  securitySchemes:
    staffToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived staff token from POST /api/v1/ops/sessions. Carries a role (OPS or ADMIN). Never sent by the website.
    accountToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived token from POST /api/v1/accounts/sessions. Identifies a signed-in traveller (ADR-0033).
    manageToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived token from POST /api/v1/pnrs/{locator}/sessions, valid for that booking only.

  parameters:
    Locator:
      name: locator
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z0-9]{6}$'

  responses:
    PnrNotFound:
      description: No booking matches
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid or expired token
    Forbidden:
      description: The token belongs to a different booking, or the role is not allowed to do this
    FlightNotFound:
      description: The flight does not operate on that date
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ScheduleUnavailable:
      description: The timetable could not be checked; retry later
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    FlightNumber:
      type: string
      pattern: '^[A-Z0-9]{2}[0-9]{1,4}$'
      example: SK501

    DisruptionType:
      type: string
      enum: [DELAYED, CANCELLED]

    RecordDisruptionRequest:
      type: object
      required: [flightNumber, departureDate, type]
      properties:
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
          description: The flight's scheduled departure date (UTC)
        type:
          $ref: '#/components/schemas/DisruptionType'
        revisedDeparture:
          type: string
          format: date-time
          description: Required for DELAYED, must be omitted for CANCELLED
        reason:
          type: string
          maxLength: 200
          description: Shown to travellers. Keep it free of personal data.

    DisruptionRecorded:
      type: object
      required: [affectedBookings]
      properties:
        affectedBookings:
          type: integer
          minimum: 0
          description: Active bookings on this flight and date

    Disruption:
      type: object
      required: [segmentIndex, flightNumber, departureDate, type]
      properties:
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 3
          description: Position of the flight in this booking
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/DisruptionType'
        revisedDeparture:
          type: string
          format: date-time
        reason:
          type: string

    BookingDisruptions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Disruption'

    SeatNumber:
      type: string
      pattern: '^[0-9]{1,2}[A-K]$'
      example: 11D

    Cabin:
      type: string
      enum: [BUSINESS, ECONOMY]

    SeatStatus:
      type: string
      enum: [AVAILABLE, HELD, BOOKED]

    Seat:
      type: object
      required: [seatNumber, row, letter, cabin, status]
      properties:
        seatNumber:
          $ref: '#/components/schemas/SeatNumber'
        row:
          type: integer
        letter:
          type: string
        cabin:
          $ref: '#/components/schemas/Cabin'
        status:
          $ref: '#/components/schemas/SeatStatus'

    SeatMap:
      type: object
      required: [flightNumber, departureDate, seats]
      properties:
        flightNumber:
          type: string
        departureDate:
          type: string
          format: date
        seats:
          type: array
          description: Ordered by row, then letter
          items:
            $ref: '#/components/schemas/Seat'

    Segment:
      type: object
      required: [flightNumber, departureDate]
      properties:
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date

    PassengerRequest:
      type: object
      required: [firstName, lastName, seats]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
        seats:
          type: array
          description: One seat per segment, in segment order
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/SeatNumber'

    QuoteRequest:
      type: object
      required: [segments, passengerCount]
      properties:
        segments:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/Segment'
        passengerCount:
          type: integer
          minimum: 1
          maximum: 9

    Quote:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          description: Total for all passengers on all flights
          example: 1240.00
        currency:
          type: string
          example: USD

    CreatePnrRequest:
      type: object
      required: [contactEmail, segments, passengers, paymentToken]
      properties:
        paymentToken:
          type: string
          pattern: '^tok_[a-z0-9_]{1,40}$'
          description: |
            Issued to the browser by the payment provider; card details never reach SkyHub.
            The mock provider knows tok_visa (approved), tok_declined and tok_provider_down.
        expectedAmount:
          type: number
          description: The price the traveller was shown. If it differs from the server's price the booking is refused.
        holdId:
          type: string
          format: uuid
          description: Hold made earlier for these exact seats. Without it, the seats are booked directly.
        contactEmail:
          type: string
          format: email
          maxLength: 254
        segments:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/Segment'
        passengers:
          type: array
          minItems: 1
          maxItems: 9
          items:
            $ref: '#/components/schemas/PassengerRequest'

    Passenger:
      type: object
      required: [firstName, lastName, seats]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        seats:
          type: array
          description: One seat per segment, in segment order
          items:
            type: string

    PnrStatus:
      type: string
      enum: [CONFIRMED, CANCELLED]

    Pnr:
      type: object
      required: [locator, status, contactEmail, segments, passengers, createdAt]
      properties:
        locator:
          type: string
          example: ABC234
        status:
          $ref: '#/components/schemas/PnrStatus'
        contactEmail:
          type: string
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/Passenger'
        createdAt:
          type: string
          format: date-time
        refund:
          description: Null unless the booking is cancelled and was paid.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Refund'

    Refund:
      type: object
      description: What happens to the money when a paid booking is cancelled.
      required: [status, amount, currency]
      properties:
        status:
          type: string
          enum: [REFUNDED, PENDING, NOT_REFUNDABLE]
          description: REFUNDED, PENDING (owed, the provider has not confirmed yet) or NOT_REFUNDABLE (cancelled too late)
        amount:
          type: number
          example: 200.00
          description: What was paid. When NOT_REFUNDABLE it is the amount that is not given back.
        currency:
          type: string
          example: USD

    CheckInRequest:
      type: object
      required: [segmentIndex]
      properties:
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 3
        passengerIndexes:
          type: array
          maxItems: 9
          items:
            type: integer
            minimum: 0
            maximum: 8
          description: |
            Which passengers to check in, by their position on the booking (ADR-0058). Absent or empty means everyone who is not yet
            checked in on this flight. A passenger who is already in is left as they are and is not renumbered.

    BoardingPass:
      type: object
      required: [passengerName, passengerIndex, locator, flightNumber, departureDate, seatNumber, sequence, barcode]
      properties:
        passengerName:
          type: string
          description: SURNAME/FIRSTNAME, upper case, as printed on the pass
          example: PERERA/PRIYA
        passengerIndex:
          type: integer
          minimum: 0
          description: The passenger's position on the booking, so a screen can tell which passenger a pass belongs to (ADR-0058)
        locator:
          type: string
          example: ABC234
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
        seatNumber:
          $ref: '#/components/schemas/SeatNumber'
        sequence:
          type: integer
          minimum: 1
          description: Boarding sequence number on this flight, in order of check-in
        barcode:
          type: string
          description: Signed payload for the gate scanner. Any change to the pass invalidates it.

    BoardingPassVerificationRequest:
      type: object
      required: [barcode]
      properties:
        barcode:
          type: string
          maxLength: 300
          description: The text scanned from the pass, as printed in `barcode` of the boarding pass.

    BoardingPassVerification:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        reason:
          type: string
          enum: [BAD_SIGNATURE, UNKNOWN_BOOKING, BOOKING_CANCELLED, FLIGHT_CANCELLED, NOT_CHECKED_IN, SUPERSEDED, ALREADY_BOARDED]
          description: Why a pass was refused. Absent for a good pass.
        pass:
          $ref: '#/components/schemas/BoardingPass'

    BoardingPasses:
      type: object
      required: [passes]
      properties:
        passes:
          type: array
          items:
            $ref: '#/components/schemas/BoardingPass'

    ManageSessionRequest:
      type: object
      required: [lastName]
      properties:
        lastName:
          type: string
          minLength: 1
          maxLength: 50

    ManageSession:
      type: object
      required: [accessToken, tokenType, expiresAt, pnr]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time
        pnr:
          $ref: '#/components/schemas/Pnr'

    RebookRequest:
      type: object
      required: [segmentIndex, flightNumber, departureDate]
      properties:
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 3
          description: Position of the flight to move in the booking
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date

    Rebooked:
      type: object
      required: [locator, segmentIndex, from, to, seats, changed]
      properties:
        locator:
          type: string
        segmentIndex:
          type: integer
        from:
          $ref: '#/components/schemas/Segment'
        to:
          $ref: '#/components/schemas/Segment'
        seats:
          type: array
          description: The new seat of each passenger, in passenger order. No names.
          items:
            $ref: '#/components/schemas/SeatNumber'
        changed:
          type: boolean
          description: false when the booking was already on that flight

    BulkRebookRequest:
      type: object
      required: [moves]
      properties:
        moves:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/BulkMove'

    BulkMove:
      type: object
      required: [locator, segmentIndex, flightNumber, departureDate]
      properties:
        locator:
          type: string
          pattern: '^[A-Z0-9]{6}$'
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 3
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date

    BulkRebooked:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MoveResult'

    MoveResult:
      type: object
      required: [locator, segmentIndex, outcome]
      properties:
        locator:
          type: string
        segmentIndex:
          type: integer
        outcome:
          type: string
          enum: [MOVED, UNCHANGED, REFUSED, NOT_FOUND, CONFLICT, UNAVAILABLE, FAILED, NOT_ATTEMPTED]
        detail:
          type: string
          nullable: true
          description: Why a move was refused or did not happen. Never a name or an address.
        seats:
          type: array
          nullable: true
          description: The new seat of each passenger, in passenger order, for MOVED and UNCHANGED.
          items:
            $ref: '#/components/schemas/SeatNumber'

    AffectedBookings:
      type: object
      required: [flightNumber, departureDate, items]
      properties:
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/AffectedBooking'

    AffectedBooking:
      type: object
      required: [locator, passengerCount, segmentIndex, segments]
      properties:
        locator:
          type: string
        passengerCount:
          type: integer
          minimum: 1
          maximum: 9
        segmentIndex:
          type: integer
          description: Position of the disrupted flight in this booking
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'

    StaffLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 40
        password:
          type: string
          minLength: 1
          maxLength: 200

    StaffRole:
      type: string
      enum: [OPS, ADMIN, GATE]
      description: |
        OPS and ADMIN run operations (ADMIN also creates staff). GATE (ADR-0060) may check a boarding pass and board a passenger, and nothing else.

    PasswordLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254

    SetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          maxLength: 100
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: |
            12 characters at least and 72 bytes in UTF-8 at most (ADR-0048). The limit is the hashing's, so a password of accented or
            non-Latin letters reaches it in fewer than 72 characters; that is a 400 from the service, not from this schema.

    AccountLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 100

    EmailChangeRequest:
      type: object
      required: [newEmail, password]
      properties:
        newEmail:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 100
          description: The account's current password.

    EmailChangeConfirmation:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 100

    EmailChangeReversal:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 100

    AccountSession:
      type: object
      required: [accessToken, tokenType, expiresAt, email]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time
        email:
          type: string

    Account:
      type: object
      required: [email]
      properties:
        email:
          type: string

    MyBookings:
      type: object
      required: [bookings, truncated]
      properties:
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/BookingSummary'
        truncated:
          type: boolean
          description: True when there are older bookings than this page holds, that is, when `nextCursor` is set.
        nextCursor:
          type: string
          nullable: true
          description: Absent on the last page. Pass it back as `cursor` to read the next page.

    BookingSummary:
      type: object
      required: [locator, status, segments, passengerCount, createdAt]
      properties:
        locator:
          type: string
          example: ABC234
        status:
          $ref: '#/components/schemas/PnrStatus'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        passengerCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    StaffSession:
      type: object
      required: [accessToken, tokenType, expiresAt, username, role]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time
        username:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'

    CreateStaffRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          pattern: '^[a-z][a-z0-9._-]{2,39}$'
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: Same rule as a traveller's password (ADR-0048), 12 characters at least and 72 bytes in UTF-8 at most.
        role:
          $ref: '#/components/schemas/StaffRole'

    StaffAccount:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'

    SeatChange:
      type: object
      required: [passengerIndex, segmentIndex, seatNumber]
      properties:
        passengerIndex:
          type: integer
          minimum: 0
          maximum: 8
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 3
        seatNumber:
          $ref: '#/components/schemas/SeatNumber'

    HoldItem:
      type: object
      required: [flightNumber, departureDate, seatNumber]
      properties:
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
        seatNumber:
          $ref: '#/components/schemas/SeatNumber'

    CreateHoldRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 36
          items:
            $ref: '#/components/schemas/HoldItem'

    Hold:
      type: object
      required: [holdId, expiresAt, items]
      properties:
        holdId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/HoldItem'

    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
