openapi: 3.0.3
info:
  title: SkyHub Booking API
  version: 1.0.0
  description: |
    Seat maps and passenger name records (PNRs). A PNR holds every segment of an itinerary
    (e.g. CMB→DXB and DWC→JFK) and one seat per passenger per segment.
servers:
  - url: http://localhost:8082
tags:
  - name: SeatMaps
  - name: Pnrs
  - name: ManageBooking
  - name: Holds
  - name: CheckIn
  - name: Disruptions
  - name: Staff
  - name: Rebooking

paths:
  /api/v1/flights/{flightNumber}/departures/{departureDate}/seats:
    get:
      tags: [SeatMaps]
      operationId: getSeatMap
      summary: Seat map for one flight on one date
      parameters:
        - name: flightNumber
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FlightNumber'
        - name: departureDate
          in: path
          required: true
          description: UTC departure date of the flight
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Seat map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FlightNotFound'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/holds:
    post:
      tags: [Holds]
      operationId: createHold
      summary: Hold seats for a few minutes while the traveller completes a booking
      description: |
        Holds every requested seat or none. The hold lasts 10 minutes. Pass the returned `holdId` to
        `POST /pnrs` to turn the held seats into a booking; if it has expired, the booking is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHoldRequest'
      responses:
        '201':
          description: Seats held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FlightNotFound'
        '409':
          description: At least one seat is not available; nothing was held
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/holds/{holdId}:
    delete:
      tags: [Holds]
      operationId: releaseHold
      summary: Let go of held seats
      description: Safe to repeat. An unknown or already-expired hold is not an error.
      parameters:
        - name: holdId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The seats are no longer held by this hold

  /api/v1/pnrs:
    post:
      tags: [Pnrs]
      operationId: createPnr
      summary: Pay for, and book, seats on every segment and create a PNR
      description: |
        The server works out the price and charges `paymentToken` before booking (ADR-0015). If booking then
        fails, the charge is refunded. The same `Idempotency-Key` never charges twice. If `expectedAmount` is
        sent and differs from the server's price, nothing is charged and the answer is 409.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key (e.g. a UUID). Repeating it returns the original PNR instead of booking again.
          schema:
            type: string
            minLength: 8
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePnrRequest'
      responses:
        '201':
          description: PNR created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '200':
          description: Replay of an earlier request with the same Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FlightNotFound'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'
        '402':
          description: The payment was declined; nothing was booked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A requested seat is no longer available (any charge was refunded), or the price changed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/quotes:
    post:
      tags: [Pnrs]
      operationId: quote
      summary: The price of a trip, worked out by the server
      description: The same calculation that `POST /pnrs` charges. Fares come from the flight schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: The price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/FlightNotFound'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/pnrs/{locator}/sessions:
    post:
      tags: [ManageBooking]
      operationId: openManageSession
      summary: Prove ownership of a booking and get a short-lived manage token
      description: |
        Checks the last name of any passenger on the booking. On success returns a signed token
        (15 minutes) that authorises reading and changing this booking only. An unknown reference
        and a wrong last name both return 404, so neither can be probed.
      parameters:
        - $ref: '#/components/parameters/Locator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageSessionRequest'
      responses:
        '201':
          description: Session opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManageSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/pnrs/{locator}:
    get:
      tags: [ManageBooking]
      operationId: getPnr
      summary: Retrieve a booking
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/pnrs/{locator}/cancellation:
    post:
      tags: [ManageBooking]
      operationId: cancelPnr
      summary: Cancel a booking and release its seats
      description: |
        Idempotent. Cancelling an already-cancelled booking returns it unchanged, except that a refund still
        `PENDING` is tried again. Money goes back in full if the airline cancelled a flight on the booking or
        the first departure is 24 hours or more away; otherwise nothing is refunded (ADR-0016). The booking is
        cancelled even when the payment provider cannot be reached: the refund is then `PENDING`.
        Returns 503 and changes nothing when the timetable cannot be checked.
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      responses:
        '200':
          description: The cancelled booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/pnrs/{locator}/seat-assignments:
    put:
      tags: [ManageBooking]
      operationId: changeSeat
      summary: Move one passenger to another seat on one flight
      description: Books the new seat and releases the old one in a single transaction.
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatChange'
      responses:
        '200':
          description: The updated booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pnr'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'
        '409':
          description: The seat is taken, or the booking is cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/pnrs/{locator}/check-ins:
    post:
      tags: [CheckIn]
      operationId: checkIn
      summary: Check in every passenger on one flight and get their boarding passes
      description: |
        Open from 24 hours to 60 minutes before departure. Idempotent: checking in again returns the same
        passes and does not renumber anyone. A flight that is checked in can no longer have its seats changed.
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInRequest'
      responses:
        '201':
          description: Checked in now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPasses'
        '200':
          description: Already checked in; the same passes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPasses'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'
        '409':
          description: Check-in is not open yet, is closed, or the booking is cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/ops/disruptions:
    post:
      tags: [Disruptions]
      operationId: recordDisruption
      summary: Record a delay or cancellation of one flight on one date
      description: |
        Idempotent: recording again for the same flight and date replaces the earlier record, so a retry or a
        correction is the same request. Returns how many active bookings are on the flight.
      security:
        - staffToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDisruptionRequest'
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisruptionRecorded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops/disruptions/{flightNumber}/{departureDate}:
    delete:
      tags: [Disruptions]
      operationId: withdrawDisruption
      summary: Take back a disruption that was recorded by mistake or has been resolved
      description: |
        Staff only. The flight is for sale again and search shows it as scheduled. Every traveller still holding the
        flight is emailed that it is operating again (ADR-0028). Refused with 409 once any booking has been
        moved off the flight, because the refund those travellers were promised rests on the disruption record.
        Returns how many active bookings are on the flight. A second request finds nothing and answers 404.
      security:
        - staffToken: []
      parameters:
        - name: flightNumber
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FlightNumber'
        - name: departureDate
          in: path
          required: true
          description: Scheduled UTC departure date of the flight
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisruptionRecorded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No disruption is recorded for that flight and date
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Bookings were moved off the flight, so the disruption has to stay on record
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/ops/flights/{flightNumber}/departures/{departureDate}/bookings:
    get:
      tags: [Disruptions]
      operationId: getAffectedBookings
      summary: The active bookings on one flight, for working out who a disruption affects
      description: |
        Staff only. Lists each confirmed booking that holds a seat on the flight, with its reference, how many
        seats it holds, which of its flights this is, and its whole route. It carries no names and no contact
        details, so the answer can be given to tools that must not see personal data (ADR-0022).
      security:
        - staffToken: []
      parameters:
        - name: flightNumber
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FlightNumber'
        - name: departureDate
          in: path
          required: true
          description: Scheduled UTC departure date of the flight
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Possibly empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffectedBookings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/ops/pnrs/{locator}/rebooking:
    post:
      tags: [Rebooking]
      operationId: rebookFlight
      summary: Move one flight of a booking onto another, after a disruption
      description: |
        Staff only (ADR-0023). Moves the given flight of the booking onto another flight, choosing seats for the whole party
        (kept together, in the cabin they were in). Refused unless the flight being left has a recorded delay or
        cancellation, the booking is active and not checked in on it, and the new flight operates, is not cancelled, flies
        the same route and does not leave before the original was due. Everything or nothing happens. Asking again for a
        move that is already done changes nothing and answers `changed: false`. The traveller is emailed.
      security:
        - staffToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebookRequest'
      responses:
        '200':
          description: Moved, or already there
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rebooked'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'
        '409':
          description: 'Refused: a rule forbids this move, or the seats are not there'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ScheduleUnavailable'

  /api/v1/ops/sessions:
    post:
      tags: [Staff]
      operationId: openStaffSession
      summary: Staff login
      description: |
        Exchanges a username and password for a staff token (30 minutes) that carries the staff member's role.
        An unknown user, a wrong password and a locked account all return the same 401. Five wrong passwords lock
        the account for 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      responses:
        '201':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong username or password, or the account is locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/ops/staff:
    post:
      tags: [Staff]
      operationId: createStaffAccount
      summary: Create a staff account
      description: Administrators only. The password is stored only as a hash.
      security:
        - staffToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: That username is taken
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/pnrs/{locator}/disruptions:
    get:
      tags: [Disruptions]
      operationId: getDisruptions
      summary: Delays and cancellations on the flights of this booking
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
      responses:
        '200':
          description: Possibly empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDisruptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PnrNotFound'

  /api/v1/pnrs/{locator}/check-ins/{segmentIndex}:
    get:
      tags: [CheckIn]
      operationId: getBoardingPasses
      summary: The boarding passes of a flight that is checked in
      security:
        - manageToken: []
      parameters:
        - $ref: '#/components/parameters/Locator'
        - name: segmentIndex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 3
      responses:
        '200':
          description: The boarding passes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPasses'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such booking, or this flight is not checked in
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The booking is cancelled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    staffToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived staff token from POST /api/v1/ops/sessions. Carries a role (OPS or ADMIN). Never sent by the website.
    manageToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived token from POST /api/v1/pnrs/{locator}/sessions, valid for that booking only.

  parameters:
    Locator:
      name: locator
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Z0-9]{6}$'

  responses:
    PnrNotFound:
      description: No booking matches
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid or expired token
    Forbidden:
      description: The token belongs to a different booking, or the role is not allowed to do this
    FlightNotFound:
      description: The flight does not operate on that date
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ScheduleUnavailable:
      description: The timetable could not be checked; retry later
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    FlightNumber:
      type: string
      pattern: '^[A-Z0-9]{2}[0-9]{1,4}$'
      example: SK501

    DisruptionType:
      type: string
      enum: [DELAYED, CANCELLED]

    RecordDisruptionRequest:
      type: object
      required: [flightNumber, departureDate, type]
      properties:
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
          description: The flight's scheduled departure date (UTC)
        type:
          $ref: '#/components/schemas/DisruptionType'
        revisedDeparture:
          type: string
          format: date-time
          description: Required for DELAYED, must be omitted for CANCELLED
        reason:
          type: string
          maxLength: 200
          description: Shown to travellers. Keep it free of personal data.

    DisruptionRecorded:
      type: object
      required: [affectedBookings]
      properties:
        affectedBookings:
          type: integer
          minimum: 0
          description: Active bookings on this flight and date

    Disruption:
      type: object
      required: [segmentIndex, flightNumber, departureDate, type]
      properties:
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 3
          description: Position of the flight in this booking
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/DisruptionType'
        revisedDeparture:
          type: string
          format: date-time
        reason:
          type: string

    BookingDisruptions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Disruption'

    SeatNumber:
      type: string
      pattern: '^[0-9]{1,2}[A-K]$'
      example: 11D

    Cabin:
      type: string
      enum: [BUSINESS, ECONOMY]

    SeatStatus:
      type: string
      enum: [AVAILABLE, HELD, BOOKED]

    Seat:
      type: object
      required: [seatNumber, row, letter, cabin, status]
      properties:
        seatNumber:
          $ref: '#/components/schemas/SeatNumber'
        row:
          type: integer
        letter:
          type: string
        cabin:
          $ref: '#/components/schemas/Cabin'
        status:
          $ref: '#/components/schemas/SeatStatus'

    SeatMap:
      type: object
      required: [flightNumber, departureDate, seats]
      properties:
        flightNumber:
          type: string
        departureDate:
          type: string
          format: date
        seats:
          type: array
          description: Ordered by row, then letter
          items:
            $ref: '#/components/schemas/Seat'

    Segment:
      type: object
      required: [flightNumber, departureDate]
      properties:
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date

    PassengerRequest:
      type: object
      required: [firstName, lastName, seats]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
        seats:
          type: array
          description: One seat per segment, in segment order
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/SeatNumber'

    QuoteRequest:
      type: object
      required: [segments, passengerCount]
      properties:
        segments:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/Segment'
        passengerCount:
          type: integer
          minimum: 1
          maximum: 9

    Quote:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          description: Total for all passengers on all flights
          example: 1240.00
        currency:
          type: string
          example: USD

    CreatePnrRequest:
      type: object
      required: [contactEmail, segments, passengers, paymentToken]
      properties:
        paymentToken:
          type: string
          pattern: '^tok_[a-z0-9_]{1,40}$'
          description: |
            Issued to the browser by the payment provider; card details never reach SkyHub.
            The mock provider knows tok_visa (approved), tok_declined and tok_provider_down.
        expectedAmount:
          type: number
          description: The price the traveller was shown. If it differs from the server's price the booking is refused.
        holdId:
          type: string
          format: uuid
          description: Hold made earlier for these exact seats. Without it, the seats are booked directly.
        contactEmail:
          type: string
          format: email
          maxLength: 254
        segments:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/Segment'
        passengers:
          type: array
          minItems: 1
          maxItems: 9
          items:
            $ref: '#/components/schemas/PassengerRequest'

    Passenger:
      type: object
      required: [firstName, lastName, seats]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        seats:
          type: array
          description: One seat per segment, in segment order
          items:
            type: string

    PnrStatus:
      type: string
      enum: [CONFIRMED, CANCELLED]

    Pnr:
      type: object
      required: [locator, status, contactEmail, segments, passengers, createdAt]
      properties:
        locator:
          type: string
          example: ABC234
        status:
          $ref: '#/components/schemas/PnrStatus'
        contactEmail:
          type: string
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/Passenger'
        createdAt:
          type: string
          format: date-time
        refund:
          description: Null unless the booking is cancelled and was paid.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Refund'

    Refund:
      type: object
      description: What happens to the money when a paid booking is cancelled.
      required: [status, amount, currency]
      properties:
        status:
          type: string
          enum: [REFUNDED, PENDING, NOT_REFUNDABLE]
          description: REFUNDED, PENDING (owed, the provider has not confirmed yet) or NOT_REFUNDABLE (cancelled too late)
        amount:
          type: number
          example: 200.00
          description: What was paid. When NOT_REFUNDABLE it is the amount that is not given back.
        currency:
          type: string
          example: USD

    CheckInRequest:
      type: object
      required: [segmentIndex]
      properties:
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 3

    BoardingPass:
      type: object
      required: [passengerName, locator, flightNumber, departureDate, seatNumber, sequence, barcode]
      properties:
        passengerName:
          type: string
          description: SURNAME/FIRSTNAME, upper case, as printed on the pass
          example: PERERA/PRIYA
        locator:
          type: string
          example: ABC234
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
        seatNumber:
          $ref: '#/components/schemas/SeatNumber'
        sequence:
          type: integer
          minimum: 1
          description: Boarding sequence number on this flight, in order of check-in
        barcode:
          type: string
          description: Signed payload for the gate scanner. Any change to the pass invalidates it.

    BoardingPasses:
      type: object
      required: [passes]
      properties:
        passes:
          type: array
          items:
            $ref: '#/components/schemas/BoardingPass'

    ManageSessionRequest:
      type: object
      required: [lastName]
      properties:
        lastName:
          type: string
          minLength: 1
          maxLength: 50

    ManageSession:
      type: object
      required: [accessToken, tokenType, expiresAt, pnr]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time
        pnr:
          $ref: '#/components/schemas/Pnr'

    RebookRequest:
      type: object
      required: [segmentIndex, flightNumber, departureDate]
      properties:
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 3
          description: Position of the flight to move in the booking
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date

    Rebooked:
      type: object
      required: [locator, segmentIndex, from, to, seats, changed]
      properties:
        locator:
          type: string
        segmentIndex:
          type: integer
        from:
          $ref: '#/components/schemas/Segment'
        to:
          $ref: '#/components/schemas/Segment'
        seats:
          type: array
          description: The new seat of each passenger, in passenger order. No names.
          items:
            $ref: '#/components/schemas/SeatNumber'
        changed:
          type: boolean
          description: false when the booking was already on that flight

    AffectedBookings:
      type: object
      required: [flightNumber, departureDate, items]
      properties:
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/AffectedBooking'

    AffectedBooking:
      type: object
      required: [locator, passengerCount, segmentIndex, segments]
      properties:
        locator:
          type: string
        passengerCount:
          type: integer
          minimum: 1
          maximum: 9
        segmentIndex:
          type: integer
          description: Position of the disrupted flight in this booking
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'

    StaffLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 40
        password:
          type: string
          minLength: 1
          maxLength: 200

    StaffRole:
      type: string
      enum: [OPS, ADMIN]

    StaffSession:
      type: object
      required: [accessToken, tokenType, expiresAt, username, role]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time
        username:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'

    CreateStaffRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
          pattern: '^[a-z][a-z0-9._-]{2,39}$'
        password:
          type: string
          minLength: 12
          maxLength: 200
        role:
          $ref: '#/components/schemas/StaffRole'

    StaffAccount:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'

    SeatChange:
      type: object
      required: [passengerIndex, segmentIndex, seatNumber]
      properties:
        passengerIndex:
          type: integer
          minimum: 0
          maximum: 8
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 3
        seatNumber:
          $ref: '#/components/schemas/SeatNumber'

    HoldItem:
      type: object
      required: [flightNumber, departureDate, seatNumber]
      properties:
        flightNumber:
          $ref: '#/components/schemas/FlightNumber'
        departureDate:
          type: string
          format: date
        seatNumber:
          $ref: '#/components/schemas/SeatNumber'

    CreateHoldRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 36
          items:
            $ref: '#/components/schemas/HoldItem'

    Hold:
      type: object
      required: [holdId, expiresAt, items]
      properties:
        holdId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/HoldItem'

    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
